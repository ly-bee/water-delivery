name: hydroflow_mobile
description: HydroFlow Water Delivery System — resident and driver mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.5
  permission_handler: ^11.4.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  image_picker: ^1.2.3
  signature: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/water_bottle.jpeg
