version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hydroflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: hydroflow_db
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - hydroflow_postgres_data:/var/lib/postgresql/data

volumes:
  hydroflow_postgres_data: